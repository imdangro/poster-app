# Automatyczne sprawdzanie każdej zmiany (pull request i push do main).
name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

# Nowy commit w PR przerywa sprawdzanie poprzedniego; push do main – zawsze do końca (grupa z SHA)
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.sha }}
  cancel-in-progress: true

jobs:
  # Zakres zmian – oszczędność minut GitHub Actions: strona (docs/), dokumenty (.md) i narzędzia wewnętrzne (tools/)
  # nie uruchamiają testów kodu ani instalatora, walidacja węzłów n8n rusza tylko przy zmianie workflow lub wersji
  # n8n, a test instalacji Dockera – przy zmianie docs/install.sh. Bez punktu odniesienia albo przy błędzie – wszystko.
  changes:
    name: Zakres zmian
    runs-on: ubuntu-latest
    outputs:
      code: ${{ steps.scope.outputs.code }}
      n8n: ${{ steps.scope.outputs.n8n }}
      installer: ${{ steps.scope.outputs.installer }}
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
      - name: Zmienione pliki
        id: scope
        env:
          BASE: ${{ github.event.pull_request.base.sha || github.event.before }}
        run: |
          code=true n8n=true installer=true
          if [ -n "$BASE" ] && [ "$BASE" != 0000000000000000000000000000000000000000 ] &&
            git fetch -q --depth=1 origin "$BASE" && files="$(git diff --name-only "$BASE" HEAD)"; then
            code=false n8n=false installer=false
            while IFS= read -r f; do
              case "$f" in
                '') ;;
                .github/*) code=true n8n=true installer=true ;;
                docs/install.sh) code=true installer=true ;;
                workflows/* | docker-compose.yml) code=true n8n=true ;;
                docs/* | tools/* | *.md) : ;;
                *) code=true ;;
              esac
            done <<<"$files"
            printf '%s\n' "$files"
          fi
          printf 'code=%s\nn8n=%s\ninstaller=%s\n' "$code" "$n8n" "$installer" | tee -a "$GITHUB_OUTPUT"

  checks:
    name: Testy i sprawdzenia
    needs: changes
    if: ${{ !cancelled() && (needs.changes.result != 'success' || needs.changes.outputs.code == 'true') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6.5.0
        with:
          node-version: 24
      - name: Składnia JS
        # node --check sprawdza tylko pierwszy podany plik – stąd pętla
        run: for f in $(find panel -name '*.js' -not -path '*/node_modules/*'); do node --check "$f" || exit 1; done
      - name: Formatowanie (prettier)
        run: npx --yes prettier@3.8.1 --check "panel/**/*.{js,css,html}" "workflows/src/**/*.js"
      - name: Skrypty bash (składnia i shellcheck)
        # bash -n sprawdza tylko pierwszy podany plik – stąd pętla; SC1111: cudzysłowy „…” w tekstach są celowe
        run: |
          for f in scripts/*.sh docs/install.sh; do bash -n "$f" || exit 1; done
          shellcheck -S warning -e SC1111 scripts/*.sh docs/install.sh
      - name: Workflow n8n zgodny ze źródłami
        run: python3 workflows/src/build.py && git diff --exit-code workflows/poster_workflow.json
      - name: Testy panelu
        run: node --test panel/test/*.test.js
      - name: docker compose config
        run: N8N_ENCRYPTION_KEY=ci PANEL_INTERNAL_TOKEN=ci-token-1234567890 docker compose --env-file /dev/null config -q
      - name: Obraz panelu
        run: docker build -t poster-panel:ci panel

  workflow-nodes:
    name: Węzły workflow względem n8n
    needs: changes
    if: ${{ !cancelled() && (needs.changes.result != 'success' || needs.changes.outputs.n8n == 'true') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6.5.0
        with:
          node-version: 24
      - name: Walidacja węzłów (wersja n8n z docker-compose.yml)
        run: |
          N8N_VERSION=$(grep -oP 'N8N_VERSION:-\K[0-9.]+' docker-compose.yml)
          # Zależności n8n takie, jak w dniu wydania tej wersji (+1 dzień zapasu) – nowe, wadliwe wydanie cudzej
          # biblioteki (np. zależność od wersji, której nie ma w npm) nie psuje sprawdzenia
          N8N_BEFORE=$(npm view n8n time --json | node -e '
            const t = JSON.parse(require("fs").readFileSync(0, "utf8"))[process.argv[1]];
            if (!t) throw new Error(`brak daty wydania n8n ${process.argv[1]}`);
            console.log(new Date(Date.parse(t) + 864e5).toISOString());' "$N8N_VERSION")
          echo "n8n ${N8N_VERSION}, zależności sprzed ${N8N_BEFORE}"
          mkdir -p "$RUNNER_TEMP/n8n" && cd "$RUNNER_TEMP/n8n"
          npm init -y > /dev/null
          npm i --no-audit --no-fund --ignore-scripts --before="$N8N_BEFORE" "n8n@${N8N_VERSION}"
          cd "$GITHUB_WORKSPACE"
          NODE_PATH="$RUNNER_TEMP/n8n/node_modules" node workflows/src/validate.js workflows/poster_workflow.json

  install-docker:
    name: Instalator – Docker na czystym ${{ matrix.image }}
    needs: changes
    if: ${{ !cancelled() && (needs.changes.result != 'success' || needs.changes.outputs.installer == 'true') }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        image: ['ubuntu:22.04', 'ubuntu:24.04', 'debian:12', 'debian:13']
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
      - name: Docker Engine i Compose v2 z repozytorium Dockera (bez demona – kontener nie ma systemd)
        run: |
          docker run --rm -v "$PWD/docs:/src:ro" '${{ matrix.image }}' bash -c '
            set -euo pipefail
            eval "$(sed "\$d" /src/install.sh)"
            distro="$(docker_distro)"
            install_docker "$distro"
            docker --version
            docker compose version
            docker buildx version
            grep -q "^deb \[arch=.* signed-by=/etc/apt/keyrings/docker.asc\] https://download.docker.com/linux/$distro " /etc/apt/sources.list.d/docker.list
          '

  install:
    name: Instalator (docs/install.sh) na czystym Dockerze
    needs: changes
    if: ${{ !cancelled() && (needs.changes.result != 'success' || needs.changes.outputs.code == 'true') }}
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
      - name: Funkcje instalatora (adres IP, język, nowy .env)
        run: |
          set -euo pipefail
          # funkcje bez uruchamiania main (ostatnia linia skryptu)
          eval "$(sed '$d' docs/install.sh)"
          for ip in 10.0.0.1 192.168.1.50 172.16.0.1 172.31.255.1 100.64.0.1 100.127.255.1; do
            is_private_ip "$ip" || { echo "adres prywatny: $ip"; exit 1; }
          done
          for ip in 172.32.0.1 172.15.0.1 100.128.0.1 100.63.0.1 8.8.8.8 51.68.10.20; do
            if is_private_ip "$ip"; then echo "adres publiczny: $ip"; exit 1; fi
          done
          # każde sprawdzenie w osobnej linii – w łańcuchu „a && b” set -e nie przerywa po błędzie a
          test "$(detect_lang en)" = en
          test "$(detect_lang pl)" = pl
          test "$(LC_ALL='' LC_MESSAGES='' LANG=pl_PL.UTF-8 detect_lang '')" = pl
          # nowy .env w sieci lokalnej: adres NAS-a, strefa czasowa hosta, zajęty port panelu → następny wolny
          cp .env.example "$RUNNER_TEMP/.env" && cd "$RUNNER_TEMP"
          host_ip() { printf '192.168.1.77'; }
          host_tz() { printf 'Europe/Berlin'; }
          port_busy() { [ "$1" = 7080 ]; }
          configure_env
          grep -qx 'NAS_IP=192.168.1.77' .env
          grep -qx 'BIND_ADDRESS=0.0.0.0' .env
          grep -qx 'TZ=Europe/Berlin' .env
          grep -qx 'PANEL_PORT=7081' .env
          grep -qx 'N8N_PORT=5678' .env
          # serwer z publicznym adresem: tylko 127.0.0.1; host w UTC → zostaje Europe/Warsaw
          cp "$GITHUB_WORKSPACE/.env.example" .env
          host_ip() { printf '51.68.10.20'; }
          host_tz() { printf ''; }
          port_busy() { return 1; }
          configure_env
          grep -qx 'NAS_IP=localhost' .env
          grep -qx 'BIND_ADDRESS=127.0.0.1' .env
          grep -qx 'TZ=Europe/Warsaw' .env
          rm .env
          # instalacja Dockera: zły zegar → podpowiedź; zajęty apt → jedna informacja; błąd → koniec wyjścia apt i kod
          apt-get() { echo 'E: Release file for http://deb.debian.org/debian/dists/trixie/InRelease is not valid yet (invalid for another 4h 2min 1s).'; return 100; }
          out="$( (apt_get update) 2>&1 || true)"
          grep -q 'timedatectl set-ntp true' <<<"$out"
          apt-get() { for s in 5 10 15; do echo "Waiting for cache lock: Could not get lock /var/lib/dpkg/lock-frontend. It is held by process 2049 (unattended-upgr)... ${s}s"; done; }
          out="$(apt_get install docker-ce 2>&1)"
          test "$(grep -c 'waiting for it to finish' <<<"$out")" = 1
          apt-get() { echo 'E: Unable to locate package docker-ce'; return 100; }
          rc=0
          out="$(apt_get install docker-ce 2>&1)" || rc=$?
          test "$rc" = 100
          grep -q 'Unable to locate package' <<<"$out"
          unset -f apt-get
          # NAS (wolumin /volume1): Docker z centrum aplikacji, instalator go nie instaluje
          is_nas() { return 0; }
          if docker_distro; then echo 'NAS: bez instalacji Dockera'; exit 1; fi
      - name: Instalacja jak „curl … | sudo bash” (repozytorium z tego commita)
        run: |
          set -o pipefail
          cat docs/install.sh | sudo env POSTER_REPO="$GITHUB_WORKSPACE" POSTER_LANG=en bash -s -- --dir "$RUNNER_TEMP/poster" |
            tee "$RUNNER_TEMP/install.log"
      - name: Panel z kodem, konto n8n, aktywny workflow
        run: |
          set -euo pipefail
          log="$RUNNER_TEMP/install.log"
          grep -q 'Poster is running' "$log"
          url="$(grep -oE 'http://[^ ]+:7080' "$log" | head -n1)"
          code="$(grep -oE '[A-Z2-9]{4}-[A-Z2-9]{4}-[A-Z2-9]{4}' "$log" | tail -n1)"
          pass="$(grep -oE 'Pn8-[0-9a-f]{8}-[0-9a-f]{8}' "$log" | tail -n1)"
          echo "panel: $url"
          curl -fsS "$url/api/session" | grep -q '"needsSetup":true'
          curl -fsS -X POST "$url/api/setup" -H 'content-type: application/json' \
            -d "{\"code\":\"$code\",\"password\":\"ci-password-1234\"}"
          curl -fsS -o /dev/null -X POST http://127.0.0.1:5678/rest/login -H 'content-type: application/json' \
            -d "{\"emailOrLdapLoginId\":\"admin@poster.local\",\"password\":\"$pass\"}"
          cd "$RUNNER_TEMP/poster"
          sudo docker compose exec -T n8n n8n list:workflow --active=true | grep -q PosterBotMain001
          # panel → n8n: zlecenie przez webhook workflow tylko z tokenem panelu (Header Auth, poświadczenie z
          # import-to-n8n.sh); zapytanie bez tokenu n8n odrzuca (403), zanim powstanie wykonanie
          sudo docker compose exec -T panel node -e "
            const call = (h) => fetch('http://n8n:5678/webhook/poster', { method: 'POST', headers: { 'content-type': 'application/json', ...h }, body: '{}' });
            (async () => {
              const no = await call({});
              const ok = await call({ 'x-poster-token': process.env.PANEL_INTERNAL_TOKEN });
              const body = await ok.json().catch(() => ({}));
              console.log('bez tokenu: HTTP ' + no.status + ' · z tokenem: HTTP ' + ok.status + ' ' + JSON.stringify(body));
              process.exit(no.status === 403 && ok.ok && body.ok === true ? 0 : 1);
            })().catch(() => process.exit(1));"
      - name: Utwardzone kontenery – ffmpeg przy programie tylko do odczytu, /healthz, łagodne zamykanie panelu
        run: |
          set -euo pipefail
          url="$(grep -oE 'http://[^ ]+:7080' "$RUNNER_TEMP/install.log" | head -n1)"
          cd "$RUNNER_TEMP/poster"
          # program panelu tylko do odczytu; pliki robocze w /tmp (w pamięci), dane w /data
          if sudo docker compose exec -T panel sh -c 'touch /app/x' 2>/dev/null; then echo 'kod panelu da się zmienić'; exit 1; fi
          sudo docker compose exec -T panel sh -c 'touch /tmp/x /data/.write-test && rm /tmp/x /data/.write-test'
          # ffmpeg z kodu panelu: WebP → JPG – pliki robocze w /tmp
          sudo docker compose exec -T panel ffmpeg -loglevel error -f lavfi -i color=c=orange:s=1200x800 -frames:v 1 /tmp/t.webp
          sudo docker compose exec -T panel node -e "
            const fs = require('fs');
            require('./lib/ffmpeg')
              .convertWebp(fs.readFileSync('/tmp/t.webp'))
              .then((r) => (fs.writeFileSync('/tmp/t.jpg', r.buffer), console.log('WebP: ' + r.mimeType + ', ' + r.buffer.length + ' B')))
              .catch((e) => (console.error(e), process.exit(1)));"
          # bez uprawnień jądra (panel, n8n) i bez podnoszenia uprawnień (wszystkie)
          for c in poster-panel poster-n8n poster-rsshub; do
            sudo docker inspect -f '{{.Name}}: cap_drop {{.HostConfig.CapDrop}}, {{.HostConfig.SecurityOpt}}, read-only {{.HostConfig.ReadonlyRootfs}}, pamięć {{.HostConfig.Memory}}' "$c"
            sudo docker inspect -f '{{.HostConfig.SecurityOpt}}' "$c" | grep -q no-new-privileges
          done
          sudo docker inspect -f '{{.HostConfig.CapDrop}}' poster-panel | grep -q ALL
          sudo docker inspect -f '{{.HostConfig.CapDrop}}' poster-n8n | grep -q ALL
          # stan dla monitoringu i healthcheck RSSHub
          curl -fsS "$url/healthz" | tee /dev/stderr | grep -q '"ok":true'
          timeout 180 sh -c 'until [ "$(sudo docker inspect -f "{{.State.Health.Status}}" poster-rsshub)" = healthy ]; do sleep 5; done'
          # łagodne zamykanie: SIGTERM → komunikat i kod wyjścia 0; potem panel wraca
          sudo docker compose stop panel
          sudo docker compose logs panel | grep -Eq 'Zamykam panel \(SIGTERM\)|Shutting down the panel \(SIGTERM\)'
          test "$(sudo docker inspect -f '{{.State.ExitCode}}' poster-panel)" = 0
          sudo docker compose up -d panel
          timeout 120 sh -c 'until [ "$(sudo docker inspect -f "{{.State.Health.Status}}" poster-panel)" = healthy ]; do sleep 3; done'
      - name: Ponowne uruchomienie – instalacja gotowa, podpowiedź aktualizacji
        run: |
          set -o pipefail
          cat docs/install.sh | sudo env POSTER_LANG=en bash -s | tee "$RUNNER_TEMP/again.log"
          grep -q 'already installed' "$RUNNER_TEMP/again.log"
      - name: Stan i logi kontenerów (po błędzie)
        if: failure()
        run: cd "$RUNNER_TEMP/poster" && sudo docker compose ps -a && sudo docker compose logs --tail=80
